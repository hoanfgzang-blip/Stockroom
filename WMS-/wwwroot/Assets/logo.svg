<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" role="img" aria-label="WMS Warehouse Logo">
  <!-- Rooftop / gable shape -->
  <polygon points="50,8 90,38 90,92 10,92 10,38" fill="currentColor"/>
  <!-- Left door cutout -->
  <rect x="18" y="60" width="18" height="32" fill="white"/>
  <!-- Right door cutout -->
  <rect x="64" y="60" width="18" height="32" fill="white"/>
  <!-- Left inner post -->
  <rect x="24" y="68" width="4" height="24" fill="currentColor"/>
  <!-- Right inner post -->
  <rect x="72" y="68" width="4" height="24" fill="currentColor"/>
  <!-- Left window transom -->
  <rect x="18" y="60" width="18" height="7" fill="currentColor"/>
  <!-- Right window transom -->
  <rect x="64" y="60" width="18" height="7" fill="currentColor"/>
  <!-- Center V notch / mountain peak cutout -->
  <polygon points="38,38 50,52 62,38 58,38 50,47 42,38" fill="white"/>
  <!-- Left diagonal stripe -->
  <polygon points="18,38 28,38 18,52" fill="white"/>
  <!-- Right diagonal stripe -->
  <polygon points="72,38 82,38 82,52" fill="white"/>
</svg>
